<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8e9ec">
  <title>Una pequeña sorpresa para ti</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #fff8f7, #f4dfe5 72%);
      color: #603b45;
      font-family: Georgia, "Times New Roman", serif;
    }
    .escena { width: min(100%, 440px); text-align: center; }
    .pista { margin: 0 0 26px; font-size: 1rem; letter-spacing: .03em; }
    .zona-sobre { height: 285px; display: grid; place-items: center; }
    .sobre {
      position: relative; width: min(340px, 86vw); height: 205px;
      background: #d99aa9; border: 0; border-radius: 8px; padding: 0;
      box-shadow: 0 18px 35px rgba(112,57,75,.18);
      cursor: pointer; perspective: 900px;
    }
    .sobre:focus-visible { outline: 3px solid #8e5264; outline-offset: 7px; }
    .solapa {
      position: absolute; inset: 0; z-index: 4; background: #efc6ce;
      clip-path: polygon(0 0, 100% 0, 50% 62%);
      transform-origin: top; transition: transform .9s ease;
    }
    .frente {
      position: absolute; inset: 0; z-index: 3;
      background: linear-gradient(145deg, #e8b6c1, #d68fa1);
      clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
      border-radius: 8px;
    }
    .sello {
      position: absolute; z-index: 5; left: 50%; top: 58%;
      transform: translate(-50%, -50%); width: 48px; height: 48px;
      display: grid; place-items: center; border-radius: 50%;
      color: white; background: #a94f68; font-size: 23px;
      box-shadow: 0 3px 9px rgba(80,30,45,.2);
      transition: opacity .4s ease;
    }
    .carta {
      position: absolute; z-index: 2; left: 7%; bottom: 12px; width: 86%;
      min-height: 190px; padding: 25px 21px; border-radius: 5px;
      background: #fffdf9; box-shadow: 0 5px 18px rgba(90,45,55,.13);
      opacity: 0; transform: translateY(35px);
      transition: transform 1s ease .35s, opacity .7s ease .35s;
      text-align: left; line-height: 1.7;
    }
    .carta h1 {
      margin: 0 0 14px; color: #a34f67; font-size: 1.55rem;
      font-weight: normal;
    }
    .carta p { margin: 0 0 15px; font-size: 1rem; }
    .firma {
      margin-top: 20px !important; text-align: right;
      color: #a34f67; font-style: italic;
    }
    .abierto .solapa { transform: rotateX(180deg); z-index: 1; }
    .abierto .sello { opacity: 0; }
    .abierto .carta { opacity: 1; transform: translateY(-65px); z-index: 5; }
    .instruccion { margin-top: 12px; font-size: .9rem; opacity: .8; }
    .corazon { color: #b85b73; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="escena">
    <p class="pista" id="pista">Tengo una pequeña sorpresa para ti…</p>
    <div class="zona-sobre">
      <button class="sobre" id="sobre" aria-label="Abrir la carta" aria-expanded="false">
        <article class="carta">
          <h1>¡Hola Amor!</h1>
          <p>Simplemente quería sacarte una sonrisa y recordarte que me gusta compartir estos pequeños momentos contigo.</p>
          <p>Y ahora... ¡te mando un beso enorme! 😘</p>
          <p class="firma">Con cariño,<br>Kervey</p>
        </article>
        <div class="solapa"></div>
        <div class="frente"></div>
        <div class="sello">♥</div>
      </button>
    </div>
    <p class="instruccion">Pulsa el sobre para abrirlo <span class="corazon">♥</span></p>
  </main>
  <script>
    const sobre = document.getElementById('sobre');
    const pista = document.getElementById('pista');
    sobre.addEventListener('click', () => {
      const abierto = sobre.classList.toggle('abierto');
      sobre.setAttribute('aria-expanded', String(abierto));
      pista.textContent = abierto
        ? 'Una pequeña sorpresa, solo para ti ❤️'
        : 'Tengo una pequeña sorpresa para ti…';
    });
  </script>
</body>
</html>
